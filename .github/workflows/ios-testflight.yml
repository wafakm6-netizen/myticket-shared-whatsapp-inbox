name: iOS TestFlight

# Builds the Capacitor iOS shell (mobile/) and uploads it to TestFlight.
# Run manually: Actions -> iOS TestFlight -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Web app URL the shell loads
        default: https://whatsapp.myticketom.com
        required: true

# Required repository secrets:
#   APPLE_TEAM_ID  - 10-character Apple Developer Team ID
#   ASC_KEY_ID     - App Store Connect API key ID
#   ASC_ISSUER_ID  - App Store Connect API issuer ID
#   ASC_KEY_P8     - full text of AuthKey_XXXX.p8 (paste as-is, including BEGIN/END lines)
# Required repository variable (optional): IOS_BUNDLE_ID (default om.myticket.inbox)

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_URL: ${{ inputs.app_url }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'om.myticket.inbox' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios

      - name: Set version and build number
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # Rebuild a valid PEM from whatever was pasted (lost line breaks,
          # missing BEGIN/END lines, or base64 of the whole file).
          python3 - <<'PY'
          import os, re, base64, textwrap
          raw = os.environ['ASC_KEY_P8'].strip()
          body = re.sub(r'-----[A-Z ]+-----', '', raw)
          body = re.sub(r'\s+', '', body)
          try:
              dec = base64.b64decode(body, validate=True)
              if dec.startswith(b'-----BEGIN'):
                  body = re.sub(r'\s+', '', re.sub(r'-----[A-Z ]+-----', '', dec.decode()))
          except Exception:
              pass
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          path = os.path.expanduser('~/.appstoreconnect/private_keys/AuthKey_' + os.environ['ASC_KEY_ID'] + '.p8')
          open(path, 'w').write(pem)
          print('key length (chars):', len(body))
          PY

      - name: Archive (unsigned; signing happens at export)
        run: |
          ls ios/App
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          echo "Building with: $TARGET"
          xcodebuild archive \
            $TARGET \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myticket-Inbox-ipa
          path: ${{ runner.temp }}/export/App.ipa
